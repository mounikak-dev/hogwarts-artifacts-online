spring.application.name=hogwarts-artifacts-online
spring.datasource.url=jdbc:h2:mem:hogwarts
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.show-sql=true
# environment variable with a default value
ai.gemini.endpoint=${AI_GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/interactions}
ai.gemini.apiKey=${AI_GEMINI_API_KEY}